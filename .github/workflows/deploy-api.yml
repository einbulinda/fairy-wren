name: Deploy FairyWren API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync API folder to server
        run: |
          rsync -avzr --delete \
            --exclude="node_modules" \
            --exclude=".env" \
            api/ \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/var/www/fairywren-api

      - name: Install dependencies and reload
        run: |
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
            cd /var/www/fairywren-api &&
            npm ci --production &&
            pm2 reload fairywren-api
          "
