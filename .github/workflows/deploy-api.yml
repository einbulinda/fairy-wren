name: Deploy FairyWren API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync API folder only
        uses: burnett01/rsync-deployments@v7.0.1
        with:
          switches: -avzr --delete \
            --exclude="node_modules" \
            --exclude=".env"
          path: api/
          remote_path: /var/www/fairywren-api
          remote_host: ${{ secrets.DO_HOST }}
          remote_user: ${{ secrets.DO_USER }}
          remote_key: ${{ secrets.DO_SSH_KEY }}

      - name: Install dependencies and reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /var/www/fairywren-api
            npm ci --production
            pm2 reload fairywren-api
